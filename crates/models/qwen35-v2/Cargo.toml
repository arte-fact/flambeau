[package]
name = "flambeau-qwen35-v2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "qwen35 dense-FFN hybrid (GDN+full-attn) model crate on the v2 stack."

[features]
default = []
hip = ["dep:flambeau-backend-hip", "dep:flambeau-backend", "flambeau-backend/hip", "flambeau-forward/hip", "flambeau-model-ops/hip", "flambeau-ops/hip"]
# CUDA alongside hip on the dual rig for the cross-backend parity test.
cuda = ["dep:flambeau-backend-cuda", "dep:flambeau-backend", "flambeau-backend/cuda", "flambeau-forward/cuda", "flambeau-model-ops/cuda", "flambeau-ops/cuda"]

[dependencies]
flambeau-core = { path = "../../core" }
flambeau-quant = { path = "../../quant" }
flambeau-model-ops = { path = "../../model-ops" }
flambeau-ops = { path = "../../ops" }
flambeau-forward = { path = "../../forward" }
flambeau-runtime = { path = "../../runtime" }
flambeau-backend = { path = "../../backend", optional = true }
flambeau-backend-hip = { path = "../../backend-hip", optional = true }
flambeau-backend-cuda = { path = "../../backend-cuda", optional = true }
anyhow.workspace = true
thiserror.workspace = true
half.workspace = true
bytemuck.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
