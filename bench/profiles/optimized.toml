# Optimized server-config profile — best-known FLAMBEAU_* env baseline
# for `flambeau serve`, derived ENTIRELY from measured certs and
# accumulated memory entries. Each setting in [env] cites its
# evidence in [provenance].
#
# This file has two purposes:
#   1. **Production reference** — the canonical "run flambeau like this"
#      env. Source it before `flambeau serve` and you're at the
#      best-known config we have data for.
#   2. **Bench baseline** — `scripts/bench/run_env_impact.py --profile`
#      uses this as the cell baseline so subsequent var sweeps measure
#      against a known-good config rather than arbitrary defaults.
#      Critical for scheduler/batching vars whose effect only appears
#      under N>1 concurrent load + INFLIGHT_SLOTS≥2 + BATCHED_DECODE=1.
#
# When this profile is updated, every cert in certs/env_impact/ that
# was measured against the previous profile becomes potentially stale.
# Re-run affected sweeps before relying on old verdicts.
#
# **Limitations:** measured on Qwen3.5/Qwen3.6 family on gfx906 (MI50),
# pp4 / tp2 / pp2tp2 topologies. Other archs / topologies may want
# different settings; treat this as the gfx906 baseline, not universal.

# ---------------------------------------------------------------------
# [env] — the env vars to set when invoking `flambeau serve`.
# Comment out a key to leave the var unset (system default).
# ---------------------------------------------------------------------
[env]

# GPU sampler — runs top-K + softmax + apply-penalties on device.
# **Win on every cell measured.** Drops chat sampler cost from
# ~12 ms/token (CPU O(V log V) sort) to ~0 ms/token.
FLAMBEAU_GPU_SAMPLER = "1"

# Batched-decode scheduler — co-batches concurrent decode steps via
# the scheduler. Required for N>1 concurrent throughput; null overhead
# at N=1. Together with FLAMBEAU_INFLIGHT_SLOTS, governs concurrency.
FLAMBEAU_BATCHED_DECODE = "1"

# Inflight slot pool — number of concurrently-active sessions the
# server tracks. 4 is a reasonable serving default. Lower (1–2) for
# single-user / interactive; higher (8) for multi-tenant prod.
# **VRAM-linear** with this value: each slot allocates its own
# KV cache + decode scratch. Pick lowest value that meets your
# expected concurrent-user count.
FLAMBEAU_INFLIGHT_SLOTS = "4"

# Prefill chunk size — tokens per forward in chunked prefill. 512 is
# the default and is adequate for prompts up to ~16k. Smaller values
# (256) reduce TTFT for short prompts at slight throughput cost.
FLAMBEAU_PREFILL_UBATCH = "512"

# Tracing level — INFO is verbose for serving; WARN keeps the log
# readable. The harness flips this to INFO during the sweep so cert
# logs capture per-call telemetry.
RUST_LOG = "warn"


# ---------------------------------------------------------------------
# [provenance] — evidence trail per env-key. Each setting in [env]
# above must have an entry here, citing the cert(s) or memory entry
# that justifies the choice.
# ---------------------------------------------------------------------
[provenance]
FLAMBEAU_GPU_SAMPLER = """
Sampler-D3 Phase A+B (memory): 35.6 → 58 t/s sampled chat = 1.63×
on Qwen3.6-35B-A3B / TP2 / 4×MI50, output coherent, no quality
regression. Sampler-D4 (penalty kernel): penalty-active sampled chat
matches no-penalty speed (57.3 ≈ 57.2 t/s). On a chat-style request
mix the gain is large; on greedy decode it's a no-op (no-op cost).
"""
FLAMBEAU_BATCHED_DECODE = """
P2.9b (memory, 2026-04-30): full continuous-batching slice.
Live tested 9B/N=2: PP 1.18× / TP2 1.21× / pp2tp2 1.15×.
35B-A3B Q4_0 / pp2tp2 / N=2: 1.30× speedup vs serial.
Zero overhead at N=1 (the path engages only when ≥1 inflight slot
is busy). Always-on is safe.
"""
FLAMBEAU_INFLIGHT_SLOTS = """
Multi-slot pool shipped P2.9b-i1 (memory, 2026-04-30): pool sized
by FLAMBEAU_INFLIGHT_SLOTS, each slot is its own session +
KvCache + scratch. 4 = serving default. VRAM scales linearly with
this knob — for a 35B-A3B model on 4×16GB, INFLIGHT_SLOTS=4 fits;
INFLIGHT_SLOTS=8 may OOM at long contexts.
"""
FLAMBEAU_PREFILL_UBATCH = """
Default in scripts/bench/run_matrix.py and existing bench/server_smoke.sh
configs. Not yet impact-audited; flagged for future env-impact run.
512 = reasonable balance of TTFT vs throughput for prompts ≤16k.
"""


# ---------------------------------------------------------------------
# [opt_in] — settings that pay off only under specific conditions.
# Don't enable globally; flip per-deployment when the condition matches.
# ---------------------------------------------------------------------
[opt_in]
FLAMBEAU_KV = """
Set to "q8" when memory-pressured. ~2× HBM saving on KV cache during
decode. Quality cert exists for Qwen3.6-35B-A3B-UD-Q4_K_S
(certs/quality/Qwen3.6-35B-A3B-UD-Q4_K_S_q8_kv.json): delta-perplexity
≤ 0.5%. Default ("f16") gives the canonical reference quality.
"""
FLAMBEAU_PREFIX_CACHE = """
Set to "1" for chat-style workloads (multi-turn same-system-prompt).
Caches prompt-prefix KV across requests. Off by default; not yet
impact-audited under concurrent load.
"""
FLAMBEAU_PREFIX_CACHE_MAX_GB = """
Cap on the prefix-cache LRU size, in GB. Default 2 (set when
FLAMBEAU_PREFIX_CACHE=1 is enabled). Tune to free VRAM minus model + KV.
"""


