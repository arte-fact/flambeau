[package]
name = "flambeau-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "flambeau"
path = "src/main.rs"

[features]
default = []
# Enables the HIP-backed `flambeau sweep --arch gfx906` path — requires
# ROCm/hipcc at build time and real MI50 hardware at run time.
hip_sweep = ["flambeau-bench/hip"]
# Enables `flambeau serve` — loads a real model on HIP devices.
hip_serve = ["flambeau-server/hip"]
# Enables debug FLAMBEAU_* env-var reads (probes, dumps, traces).
# Off by default; production binaries elide all gated reads.
# (flambeau-server propagates the flag to flambeau-qwen3-moe and
# flambeau-quant transitively; this CLI only depends on those crates
# directly which are already covered.)
dev_trace = [
    "flambeau-quant/dev_trace",
    "flambeau-server/dev_trace",
]

[dependencies]
flambeau-core = { path = "../core" }
flambeau-quant = { path = "../quant" }
flambeau-runtime = { path = "../runtime" }
flambeau-bench = { path = "../bench" }
flambeau-server = { path = "../server" }
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
