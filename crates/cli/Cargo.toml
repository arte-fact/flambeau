[package]
name = "flambeau-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "flambeau"
path = "src/main.rs"

[features]
default = []
# Enables the HIP-backed `flambeau sweep --arch gfx906` path — requires
# ROCm/hipcc at build time and real MI50 hardware at run time.
hip_sweep = ["flambeau-bench/hip"]
# Enables the CUDA-backed `flambeau sweep --arch sm_86` path (RTX 3090) —
# requires nvcc at build time + an NVIDIA GPU at run time. Compose with
# hip_sweep to build one binary that drives both rigs.
cuda_sweep = ["flambeau-bench/cuda"]
# Enables `flambeau serve` — loads a real model on HIP devices.
hip_serve = ["flambeau-server/hip"]
# Enables `flambeau serve --backend cuda` single-device serving on the RTX.
# Built alongside hip_serve on the dual rig (the server's forward path is
# hip-gated): `--features hip_serve,cuda_serve`.
cuda_serve = ["flambeau-server/cuda"]
# Enables debug FLAMBEAU_* env-var reads (probes, dumps, traces).
# Off by default; production binaries elide all gated reads.
dev_trace = [
    "flambeau-quant/dev_trace",
    "flambeau-server/dev_trace",
]

[dependencies]
flambeau-core = { path = "../core" }
flambeau-quant = { path = "../quant" }
flambeau-runtime = { path = "../runtime" }
flambeau-bench = { path = "../bench" }
flambeau-server = { path = "../server" }
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Global allocator override. mimalloc beats glibc's ptmalloc on the
# tokio HTTP path under concurrency (less arena-lock contention) and
# on the per-request alloc churn (smaller-block fast path). Linked at
# the binary, so kernel crates and lib crates are unaffected.
mimalloc = { version = "0.1", default-features = false }

[lints]
workspace = true
