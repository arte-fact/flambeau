    const int n_blocks_per_row"""
body = "mmvq_dp4a_row<Q5_0, 256, fb_fp16_t>(x, y, dst, n_rows, n_blocks_per_row);"

# Q5_1 single-row MMVQ — 5-bit with per-block min (y = d*q5 + m).
[[kernel]]
stem = "mmvq_q5_1"
includes = ["quant_traits.cuh", "mmvq.cuh"]

[[kernel.entry]]
name = "flambeau_mmvq_q5_1_q8_1"
params = """
