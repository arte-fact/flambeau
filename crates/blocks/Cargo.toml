[package]
name = "flambeau-blocks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reusable model-building blocks (StandardAttention, MoeExperts, DenseMlp, DeltaNetLayer) generic over a backend `Ops` trait."

[features]
default = []
# V1 only has the HIP backend; gating mirrors flambeau-ops so a CUDA
# port can opt into a parallel `cuda` feature without dep re-selection
# downstream.
hip = ["flambeau-ops/hip", "dep:flambeau-backend-hip", "dep:flambeau-runtime"]

[dependencies]
flambeau-core = { path = "../core" }
flambeau-ops = { path = "../ops" }
flambeau-quant = { path = "../quant" }
flambeau-backend-hip = { path = "../backend-hip", optional = true }
flambeau-runtime = { path = "../runtime", optional = true }
anyhow.workspace = true
bytemuck.workspace = true
half.workspace = true
tracing.workspace = true

[lints]
workspace = true
