notes   = "Phase 3a — DP4A r2 multi-row port of llama.cpp vec_dot_q4_K_q8_1_impl_vmmq. 64 threads, 2 rows per block, half-warp reduce. Replaces nw1_r2 which did per-element scalar FP32 multiplies (rocprofv3 on Qwen3.6-27B UD-Q4_K_XL pp2: 384 us/call → expected ~100 us/call, the Q5_K/Q6_K dp4a regime). Prior scalar r2 cert kept at certs/hip/gfx906/qmatmul_q4_K_mmvq_nw1_r2_gfx906.json for regression cross-check."

