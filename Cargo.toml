[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/quant",
  "crates/kernels-shared",
  "crates/kernels-hip",
  "crates/backend-hip",
  "crates/ops",
  "crates/model-ops",
  "crates/forward",
  "crates/models/qwen35-v2",
  "crates/models/qwen35moe-v2",
  "crates/models/gemma4-v2",
  "crates/runtime",
  "crates/bench",
  "crates/server-core",
  "crates/server",
  "crates/cli",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/arte-fact/flambeau"

[workspace.dependencies]
# Shared across crates — pin once here, reference via `workspace = true`.
anyhow = "1"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
byteorder = "1"
half = { version = "2", features = ["bytemuck"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps JSON object field order on parse/serialise —
# required for byte-for-byte chat-template parity with llama.cpp, whose
# Python-style `tojson` preserves declaration order (V2.12, T1.3).
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Server
axum = { version = "0.7", features = ["json"] }
tower = "0.5"
# Model loading
memmap2 = "0.9"
rayon = "1"
tokenizers = "0.20"
# `json`: enables the `tojson` filter the Qwen3.6 chat template uses
# (V2.12, certs/chat_template/qwen35moe_tools/). `preserve_order`:
# minijinja's internal map switches from BTreeMap to IndexMap so object
# field order survives round-tripping through `{{ x | tojson }}` —
# required for byte-parity with llama.cpp's (Python-style) render.
minijinja = { version = "2", features = ["json", "preserve_order"] }
# CLI
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1         # keep line info for rocprofv3 / perf attribution
# C9: server posture — any panic is fatal-and-restart. A/B tested
# 2026-04-23 on Qwen3.6-27B-Q8_0 Mesh<4>: no measurable perf delta on
# pp=512 or tg=64 (5 reps each). Kept for code-size / unwind-table trim.
# `debug = 1` above preserves crash lines in perf/rocprofv3 traces.
panic = "abort"

[profile.dev]
opt-level = 1 # compiled kernels are slow without this; pure-Rust is fine at 1

# Pure-Rust glue crate: opt-level=1 buys nothing at runtime here but costs
# codegen time on the 4 big modules (impls.rs 1512 LOC, device.rs 1204,
# bar_p2p.rs 1058, cluster.rs 1027). Override to 0 for faster dev rebuilds.
[profile.dev.package.flambeau-backend-hip]
opt-level = 0

[profile.release-dev]
inherits = "release"
lto = "off"
codegen-units = 16

# Workspace-wide lint configuration — per M-STATIC-VERIFICATION.
# Member crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
ambiguous_negative_literals = "warn"
# Internal types (HIP handles, atomic bounce buffers, etc.) don't all carry
# Debug — adding it mechanically produces output that's less useful than
# manual impls on the types where it matters.  Flip back to "warn" if any
# crate becomes externally consumed.
missing_debug_implementations = "allow"
redundant_imports = "warn"
redundant_lifetimes = "warn"
# c_int == i32 on all tier-1 targets; explicit `as c_int` casts document the
# C-ABI expectation at the call site. Removing them hurts readability more
# than it helps.
trivial_numeric_casts = "allow"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
