    const int n_rows,
    const int n_blocks_per_row"""
body = "mmvq_dp4a_row<Q8_0, 128>(x, y, dst, n_rows, n_blocks_per_row);"

# Q8_0 VDR=2 config variants — 4 threads/block, 2 dp4a chained per slot then one
# scale multiply (mmvq_dp4a_vdr_row). dp4a_vdr2 = 256t; t128_vdr2 = 128t.
[[kernel]]
stem = "mmvq_q8_0_dp4a_vdr2"
