# HIP gfx906 (Radeon VII / MI50) dispatch matrix — PRIMARY tuned target.
#
# Schema:
#   [[<op_family>]]               # qmatmul | qmatmul_moe | attention_decode |
#                                 # attention_prefill | rmsnorm | rope | softmax |
#                                 # swiglu | topk | quantize | collective
#   dtype       = "Q4_K"          # single dtype string
#   dtype_q     = "Q8_1"          # activation dtype for quant ops
#   shape       = { <axis> = "<predicate>", ... }
#                                 # predicates: "any" | ">=N" | "<N" | "A..B" | literal
#   impl        = "<impl_id>"     # matches a KernelImpl::ID in backend-hip
#   cert        = "certs/hip/gfx906/<impl_id>.json"
#   notes       = "<optional one-liner>"
#
# Rules:
#   - Every `impl` must reference an IMPL registered in backend-hip.
#   - Every `cert` path must exist and be green. `flambeau cert-check --arch gfx906`
#     enforces.
#   - Two rows whose `shape` predicates both match the same concrete shape =
#     build-time error.
#   - Most-specific predicate wins. "any" is the fallback.
#   - No env-flag gating. Runtime overrides go in gfx906.local.toml (gitignored).
#
# V1.3: multi-row DPP MMVQ kernels (candle P29 `_nw1_r{2,4}`) are the active
# dispatch targets for Q4_K/Q5_K/Q6_K on the decode path. Q8_0 ships the
# 256-thread single-row kernel. Single-row reference MMVQ kernels for the
# K-quants are kept in-tree for cert cross-checks; their certs live at
# `certs/hip/gfx906/qmatmul_q{4,5,6}_K_mmvq_single_row_gfx906.json` but are
# not dispatched from.

# ----- QMatMul MMVQ (decode / small-M path) ---------------------------------
#
# V1.7.6.f: Runtime Recipe::from_impl_id in ops/hip/qmatmul.rs intercepts the
# dispatch-table impl_ids and rewrites them to DP4A variants (validated
# bit-for-bit parity vs llama.cpp on Qwen3.6-35B 8-token greedy). The rows
# below remain the "table of record" baseline; the DP4A variants inherit the
# same cert since they're numerically equivalent modulo float-accumulation
# order. FLAMBEAU_VARIANT=baseline reverts at runtime for regression testing.

[[qmatmul]]
dtype   = "Q8_0"
dtype_q = "Q8_1"
shape   = { m = "1..3", k = "any", n = "any" }
impl    = "qmatmul_q8_0_mmvq_single_row_gfx906"
cert    = "certs/hip/gfx906/qmatmul_q8_0_mmvq_single_row_gfx906.json"
notes   = "Runtime intercept: DP4A VDR=2 variant (mmvq_q8_0_dp4a_vdr2, +19% decode vs scalar). Base row kept for baseline reference. 256-thread, wave64, DPP warp reduce."

[[qmatmul]]
dtype   = "Q4_K"
dtype_q = "Q8_1"
shape   = { m = "1..127", k = "any", n = "any" }
impl    = "qmatmul_q4_K_mmvq_nw1_r2_gfx906"
cert    = "certs/hip/gfx906/qmatmul_q4_K_mmvq_nw1_r2_gfx906.json"
notes   = "P29 multi-row DPP r2 — 2 output rows per wave64, half-warp reduce. VGPR 24, waves/SIMD 10. Narrowed to m<=127 in V1.4 — Q4_K MMQ handles m>=128."

[[qmatmul]]
dtype   = "Q5_K"
dtype_q = "Q8_1"
shape   = { m = "1..512", k = "any", n = "any" }
impl    = "qmatmul_q5_K_mmvq_nw1_r2_gfx906"
cert    = "certs/hip/gfx906/qmatmul_q5_K_mmvq_nw1_r2_gfx906.json"
notes   = "P29 r2 variant of Q4_K r2; adds 5th bit from qh[]. VGPR 25, waves/SIMD 10."

[[qmatmul]]
dtype   = "Q6_K"
dtype_q = "Q8_1"
shape   = { m = "1..127", k = "any", n = "any" }
impl    = "qmatmul_q6_K_mmvq_nw1_r4_gfx906"
cert    = "certs/hip/gfx906/qmatmul_q6_K_mmvq_nw1_r4_gfx906.json"
notes   = "Runtime intercept: DP4A variant (mmvq_q6_k_dp4a, 3.24× per-call speedup — biggest single-kernel structural win on LM-head). Base row kept for baseline reference."

# ----- QMatMul MMQ (prefill / large-M path) ---------------------------------
#
# V1.4: only the Q8_0 correctness oracle is live. First-class 4-warp
# LDS-tiled kernels (llamacpp-turbo port) + Q4_K / Q6_K MMQ variants land
# next session; they replace the same impl_id column with faster kernels
# tested against this oracle cert.

[[qmatmul_mmq]]
dtype   = "Q8_0"
dtype_q = "Q8_1"
shape   = { m = ">=128", k = "any", n = "any" }
