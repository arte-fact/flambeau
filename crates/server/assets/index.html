<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Flambeau</title>
<style>
  /* ---- Nord palette ---- */
  :root {
    --n0:#2e3440; --n1:#3b4252; --n2:#434c5e; --n3:#4c566a;
    --n4:#d8dee9; --n5:#e5e9f0; --n6:#eceff4;
    --n7:#8fbcbb; --n8:#88c0d0; --n9:#81a1c1; --n10:#5e81ac;
    --n11:#bf616a; --n12:#d08770; --n13:#ebcb8b; --n14:#a3be8c; --n15:#b48ead;

    --bg:          var(--n0);
    --bg-soft:     #292e39;
    --panel:       var(--n1);
    --panel-2:     var(--n2);
    --border:      #3b4252;
    --border-2:    #4c566a;
    --text:        var(--n6);
    --text-soft:   var(--n4);
    --text-mute:   #7b8394;
    --accent:      var(--n12);
    --accent-hov:  #d99985;
    --user-bg:     var(--n1);
    --code-bg:     #252932;
  }

  @media (prefers-color-scheme: light) {
    /* stay dark; Nord looks best dark here */
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .app {
    display: grid;
    grid-template-rows: 56px 1fr auto;
    height: 100vh;
    width: 100%;
  }

  /* ---- Top bar ---- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-family: "Iowan Old Style", "Apple Garamond", "Baskerville", "Times New Roman",
                 "Droid Serif", Times, serif;
    font-size: 19px;
    letter-spacing: 0.2px;
    color: var(--text);
  }
  .brand .spark {
    width: 18px; height: 18px; display: inline-block;
    background: radial-gradient(circle, var(--accent) 0 40%, transparent 42%),
                conic-gradient(var(--accent) 0 25%, transparent 0 50%, var(--accent) 0 75%, transparent 0);
    mask: radial-gradient(circle, white 40%, transparent 42%),
          conic-gradient(black 0 25%, transparent 0 50%, black 0 75%, transparent 0);
    border-radius: 50%;
    filter: drop-shadow(0 0 4px rgba(208,135,112,0.35));
  }
  .model-tag {
    font-size: 12.5px; color: var(--text-mute);
    background: var(--panel);
    padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--border);
    max-width: 50vw;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---- Chat scroll area ---- */
  main {
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-thumb {
    background: var(--border-2); border-radius: 10px;
  }

  .thread {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 24px 120px;
  }

  /* Empty state */
  .hero {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: calc(100vh - 56px - 180px);
    text-align: center;
  }
  .hero h1 {
    font-family: "Iowan Old Style", "Apple Garamond", "Baskerville", "Times New Roman",
                 "Droid Serif", Times, serif;
    font-weight: 500;
    font-size: 42px;
    line-height: 1.15;
    color: var(--text);
    margin: 0 0 32px;
    letter-spacing: -0.5px;
  }
  .hero h1 .accent { color: var(--accent); }

  /* Messages */
  .msg { margin: 28px 0; }
  .msg.user {
    display: flex; justify-content: flex-end;
  }
  .msg.user .bubble {
    max-width: 82%;
    background: var(--user-bg);
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: 16px;
    border-top-right-radius: 4px;
    white-space: pre-wrap;
    word-wrap: break-word;
    color: var(--text);
  }
  .msg.assistant { padding: 4px 2px; }
  .msg.assistant .content {
    color: var(--text);
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.assistant .content code {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.92em;
    color: var(--n8);
    font-family: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
  }

  /* C3.1 — markdown elements rendered inside .md-buffer. Reset to no
     pre-wrap so block-level elements (lists, blockquotes, code blocks)
     control their own whitespace. */
  .msg.assistant .md-buffer {
    display: block;
    white-space: normal;
  }
  .msg.assistant .md-buffer p {
    margin: 0 0 10px;
    white-space: pre-wrap;
  }
  .msg.assistant .md-buffer p:last-child { margin-bottom: 0; }
  .msg.assistant .md-buffer h1,
  .msg.assistant .md-buffer h2,
  .msg.assistant .md-buffer h3 {
    margin: 18px 0 8px;
    line-height: 1.25;
    color: var(--text);
  }
  .msg.assistant .md-buffer h1 { font-size: 1.45em; font-weight: 600; }
  .msg.assistant .md-buffer h2 { font-size: 1.25em; font-weight: 600; }
  .msg.assistant .md-buffer h3 { font-size: 1.10em; font-weight: 600; }
  .msg.assistant .md-buffer ul,
  .msg.assistant .md-buffer ol {
    margin: 0 0 10px;
    padding-left: 24px;
  }
  .msg.assistant .md-buffer li { margin: 2px 0; }
  .msg.assistant .md-buffer blockquote {
    margin: 10px 0;
    padding: 6px 12px;
    border-left: 3px solid var(--border-2);
    color: var(--text-soft);
    background: rgba(76,86,106,0.15);
    border-radius: 0 6px 6px 0;
  }
  .msg.assistant .md-buffer hr {
    border: 0;
    border-top: 1px solid var(--border-2);
    margin: 14px 0;
  }
  .msg.assistant .md-buffer a {
    color: var(--n8);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .msg.assistant .md-buffer strong { color: var(--text); font-weight: 600; }
  .msg.assistant .md-buffer em     { color: var(--text); font-style: italic; }
  .msg.assistant .md-buffer pre {
    margin: 10px 0;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    font-family: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.45;
  }
  .msg.assistant .md-buffer pre code {
    background: transparent;
    padding: 0;
    color: var(--text);
    font-size: inherit;
  }
  .msg.assistant .md-buffer pre.unterminated {
    border-color: var(--n13);
    border-style: dashed;
  }

  /* C3.2 — syntax-highlighting tokens. Nord palette spans. */
  .msg.assistant .md-buffer .hl-comment { color: var(--n3); font-style: italic; }
  .msg.assistant .md-buffer .hl-string  { color: var(--n14); }
  .msg.assistant .md-buffer .hl-keyword { color: var(--n9); font-weight: 500; }
  .msg.assistant .md-buffer .hl-number  { color: var(--n15); }
  .msg.assistant .md-buffer .hl-type    { color: var(--n7); }
  .msg.assistant .md-buffer .hl-builtin { color: var(--n13); }
  .msg.assistant .md-buffer .hl-preproc { color: var(--n12); }

  /* C1.1 — Tool-call cards.
     One <details> per tool call the model emitted, accumulating
     `function.name` + streaming `function.arguments`. Distinct from
     plain content so the user sees at a glance "the model is making
     a tool call right now". */
  .tool-call-card {
    margin: 10px 0;
    background: rgba(208,135,112,0.06);
    border: 1px solid rgba(208,135,112,0.35);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    overflow: hidden;
    font-family: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }
  .tool-call-card > summary {
    list-style: none;
    cursor: pointer;
    padding: 8px 12px;
    color: var(--accent);
    user-select: none;
    display: flex; align-items: center; gap: 8px;
    background: rgba(208,135,112,0.04);
  }
  .tool-call-card > summary::-webkit-details-marker { display: none; }
  .tool-call-card > summary::before {
    content: "▶";
    font-size: 9px;
    color: var(--text-mute);
    transition: transform 120ms ease;
    display: inline-block;
  }
  .tool-call-card[open] > summary::before { transform: rotate(90deg); }
  .tool-call-card .tc-icon { color: var(--accent); }
  .tool-call-card .tc-name { color: var(--text); font-weight: 500; }
  .tool-call-card .tc-id {
    color: var(--text-mute); font-size: 11px;
    margin-left: auto;
  }
  .tool-call-card pre.tc-args {
    margin: 0;
    padding: 10px 12px;
    color: var(--text);
    background: var(--code-bg);
    white-space: pre-wrap;
    word-break: break-word;
    border-top: 1px solid var(--border);
    line-height: 1.45;
  }
  .tool-call-card pre.tc-args.streaming::after {
    content: "▎";
    color: var(--accent);
    margin-left: 2px;
    animation: blink 1s steps(2, start) infinite;
  }
  .role-tag {
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-mute);
    margin-bottom: 8px;
  }

  /* typing caret */
  .caret {
    display: inline-block;
    width: 7px; height: 1.05em;
    margin-left: 2px;
    vertical-align: -0.15em;
    background: var(--accent);
    animation: blink 1s steps(2, start) infinite;
    border-radius: 1px;
  }
  @keyframes blink { to { visibility: hidden; } }

  /* empty-response notice */
  .empty-hint {
    color: var(--text-mute);
    font-style: italic;
    font-size: 14px;
  }
  .empty-hint .finish { color: var(--n13); }

  /* C1.2 — finish_reason badge in the assistant footer.
     Shows up below the assistant turn when finish_reason="tool_calls",
     and as a quieter pill for the other finish reasons. */
  .finish-badge {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 8px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    letter-spacing: 0.04em;
    background: var(--panel);
    border: 1px solid var(--border-2);
    color: var(--text-mute);
    user-select: none;
  }
  .finish-badge.tool-calls {
    background: rgba(208,135,112,0.10);
    border-color: rgba(208,135,112,0.4);
    color: var(--accent);
  }
  .finish-badge.length {
    background: rgba(235,203,139,0.10);
    border-color: rgba(235,203,139,0.4);
    color: var(--n13);
  }

  /* C1.2 — tool-reply form. Inline below the assistant turn with one
     textarea per tool_call_id; user types/pastes results, single
     "Send tool results" button replays the conversation. */
  .tool-reply-form {
    margin-top: 10px;
    padding: 12px;
    border: 1px dashed var(--border-2);
    border-radius: 10px;
    background: rgba(208,135,112,0.04);
  }
  .tool-reply-form .trf-title {
    font-size: 12px;
    color: var(--text-mute);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  .tool-reply-form .trf-row {
    margin-bottom: 8px;
  }
  .tool-reply-form .trf-row:last-child { margin-bottom: 0; }
  .tool-reply-form .trf-label {
    display: block;
    font-size: 12px;
    color: var(--text-soft);
    margin-bottom: 4px;
    font-family: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  .tool-reply-form .trf-label .trf-call-name {
    color: var(--accent);
  }
  .tool-reply-form textarea {
    width: 100%;
    min-height: 64px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text);
    font-family: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.45;
    resize: vertical;
    box-sizing: border-box;
  }
  .tool-reply-form textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  .tool-reply-form .trf-actions {
    display: flex; gap: 8px; align-items: center;
    margin-top: 4px;
  }
  .tool-reply-form button {
    background: var(--accent);
    color: var(--n0);
    border: 0;
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  .tool-reply-form button:hover { background: var(--accent-hov); }
  .tool-reply-form button.ghost {
    background: transparent;
    border: 1px solid var(--border-2);
    color: var(--text-mute);
  }
  .tool-reply-form button.ghost:hover {
    color: var(--text);
    border-color: var(--text-mute);
  }
  .tool-reply-form .trf-hint {
    font-size: 11px;
    color: var(--text-mute);
    margin-left: auto;
  }

  /* error banner */
  .error {
    background: rgba(191,97,106,0.12);
    border: 1px solid var(--n11);
    color: var(--n11);
    padding: 10px 14px;
    border-radius: 10px;
    margin: 16px 0;
    font-size: 14px;
  }

  /* C4.2 — remote-tools panel. Collapsible, shows MCP upstreams the
     server boot enumerated. Hidden entirely when /v1/tools returns
     count=0 so single-process users (no --mcp flag) don't see a
     dangling empty section. */
  .tools-panel {
    background: var(--panel);
    border: 1px solid var(--border-2);
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
    font-size: 13px;
  }
  .tools-panel > summary {
    list-style: none;
    cursor: pointer;
    padding: 9px 14px;
    user-select: none;
    color: var(--text-soft);
    display: flex; align-items: center; gap: 10px;
  }
  .tools-panel > summary::-webkit-details-marker { display: none; }
  .tools-panel > summary::before {
    content: "▶";
    font-size: 9px;
    color: var(--text-mute);
    transition: transform 120ms ease;
    display: inline-block;
  }
  .tools-panel[open] > summary::before { transform: rotate(90deg); }
  .tools-panel .tp-icon { font-size: 13px; }
  .tools-panel .tp-summary {
    color: var(--text-mute);
    font-size: 11.5px;
    margin-left: auto;
    font-family: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  .tools-panel .tp-refresh {
    background: transparent;
    border: 0;
    color: var(--text-mute);
    cursor: pointer;
    font-size: 14px;
    padding: 0 4px;
    margin-left: 4px;
    border-radius: 4px;
  }
  .tools-panel .tp-refresh:hover {
    color: var(--text);
    background: var(--bg-soft);
  }
  .tools-panel .tp-body {
    padding: 0 14px 14px;
  }
  .tools-panel .tp-server {
    margin-top: 8px;
    padding: 8px 10px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .tools-panel .tp-server-head {
    color: var(--accent);
    font-family: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    margin-bottom: 6px;
    word-break: break-all;
  }
  .tools-panel .tp-tool {
    margin: 6px 0;
    padding: 6px 0;
    border-top: 1px solid var(--border);
  }
  .tools-panel .tp-tool:first-of-type {
    border-top: 0;
    padding-top: 0;
  }
  .tools-panel .tp-tool-name {
    color: var(--text);
    font-family: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 12.5px;
    font-weight: 500;
  }
  .tools-panel .tp-tool-desc {
    color: var(--text-soft);
    font-size: 12px;
    margin-top: 2px;
  }
  .tools-panel .tp-tool-schema {
    margin-top: 4px;
    background: var(--code-bg);
    border-radius: 6px;
    padding: 6px 8px;
    font-family: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--text-soft);
    overflow-x: auto;
    white-space: pre;
  }

  /* C2.1 — sampler panel above the composer. Collapsible <details>
     with a 3-column grid of number inputs. Persists per-field in
     localStorage; the summary chip shows the most-edited fields so
     the user knows the panel isn't pristine without expanding. */
  .sampler-panel {
    background: var(--panel);
    border: 1px solid var(--border-2);
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
    font-size: 13px;
  }
  .sampler-panel > summary {
    list-style: none;
    cursor: pointer;
    padding: 9px 14px;
    user-select: none;
    color: var(--text-soft);
    display: flex; align-items: center; gap: 10px;
  }
  .sampler-panel > summary::-webkit-details-marker { display: none; }
  .sampler-panel > summary::before {
    content: "▶";
    font-size: 9px;
    color: var(--text-mute);
    transition: transform 120ms ease;
    display: inline-block;
  }
  .sampler-panel[open] > summary::before { transform: rotate(90deg); }
  .sampler-panel .sp-icon {
    color: var(--text-mute);
    font-size: 13px;
  }
  .sampler-panel .sp-summary {
    color: var(--text-mute);
    font-size: 11.5px;
    margin-left: auto;
    font-family: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 60%;
  }
  .sampler-panel .sp-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px 12px;
    padding: 4px 14px 14px;
  }
  @media (max-width: 600px) {
    .sampler-panel .sp-grid { grid-template-columns: repeat(2, 1fr); }
  }
  .sampler-panel .sp-field {
    display: flex; flex-direction: column;
    gap: 3px;
  }
  .sampler-panel .sp-field > span {
    color: var(--text-mute);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-family: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  .sampler-panel .sp-field input {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    color: var(--text);
    font-family: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    box-sizing: border-box;
    outline: none;
  }
  .sampler-panel .sp-field input:focus { border-color: var(--accent); }
  .sampler-panel .sp-field input::placeholder { color: var(--text-mute); }
  .sampler-panel .sp-actions {
    display: flex; align-items: center; gap: 12px;
    padding: 0 14px 12px;
  }
  .sampler-panel .sp-reset {
    background: transparent;
    border: 1px solid var(--border-2);
    color: var(--text-mute);
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .sampler-panel .sp-reset:hover {
    color: var(--text);
    border-color: var(--text-mute);
  }
  .sampler-panel .sp-hint {
    color: var(--text-mute);
    font-size: 11px;
  }

  /* ---- Composer ---- */
  footer {
    padding: 14px 24px 22px;
    background: linear-gradient(to top, var(--bg) 70%, rgba(46,52,64,0));
  }
  .composer-wrap {
    max-width: 760px;
    margin: 0 auto;
  }
  .composer {
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border-2);
    border-radius: 24px;
    padding: 10px 10px 10px 16px;
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }
  .composer:focus-within {
    border-color: var(--n9);
    box-shadow: 0 0 0 3px rgba(129,161,193,0.18);
  }
  .composer textarea {
    flex: 1 1 auto;
    background: transparent;
    border: 0; outline: 0; resize: none;
    color: var(--text);
    font: inherit;
    line-height: 1.5;
    padding: 6px 0;
    max-height: 240px;
    min-height: 24px;
  }
  .composer textarea::placeholder { color: var(--text-mute); }

  .send-btn {
    flex: 0 0 auto;
    width: 36px; height: 36px;
    border: 0;
    border-radius: 50%;
    background: var(--accent);
    color: var(--n0);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 120ms ease, transform 80ms ease;
  }
  .send-btn:hover:not(:disabled) { background: var(--accent-hov); }
  .send-btn:active:not(:disabled) { transform: scale(0.94); }
  .send-btn:disabled {
    background: var(--border-2);
    color: var(--text-mute);
    cursor: not-allowed;
  }
  .send-btn svg { width: 18px; height: 18px; }

  /* pill shortcuts under composer on empty state */
  .pills {
    display: flex; gap: 10px; flex-wrap: wrap;
    justify-content: center;
    margin-top: 16px;
  }
  .pill {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-soft);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13.5px;
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
  }
  .pill:hover {
    background: var(--panel-2);
    border-color: var(--border-2);
    color: var(--text);
  }
  .pill .ico { margin-right: 6px; opacity: 0.9; }

  .footnote {
    text-align: center;
    color: var(--text-mute);
    font-size: 11.5px;
    margin-top: 10px;
  }
  .footnote .dot { opacity: 0.4; margin: 0 6px; }

  /* hide/show hero based on thread state */
  .thread.has-messages .hero { display: none; }

  /* thinking indicator on assistant row before first token */
  .dots { display: inline-flex; gap: 4px; padding: 4px 0; }
  .dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-mute);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40%            { transform: translateY(-4px); opacity: 1; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="spark"></span>
      <span>Flambeau</span>
    </div>
    <div class="model-tag" id="model-tag">loading…</div>
  </header>

  <main id="main">
    <div class="thread" id="thread">
      <div class="hero" id="hero">
        <h1>How can I <span class="accent">help</span> you today?</h1>
      </div>
    </div>
  </main>

  <footer>
    <div class="composer-wrap">
      <details class="tools-panel" id="tools-panel" hidden>
        <summary>
          <span class="tp-icon">🛠</span>
          <span>Remote tools</span>
          <span class="tp-summary" id="tp-summary"></span>
          <button type="button" class="tp-refresh" id="tp-refresh" title="Refresh">↻</button>
        </summary>
        <div class="tp-body" id="tp-body"></div>
      </details>
      <details class="sampler-panel" id="sampler-panel">
        <summary>
          <span class="sp-icon">⚙</span>
          <span>Sampler</span>
          <span class="sp-summary" id="sp-summary"></span>
        </summary>
        <div class="sp-grid">
          <label class="sp-field">
            <span>temperature</span>
            <input type="number" id="sp-temperature" step="0.05" min="0" max="2" />
          </label>
          <label class="sp-field">
            <span>top_p</span>
            <input type="number" id="sp-top_p" step="0.05" min="0" max="1" />
          </label>
          <label class="sp-field">
            <span>top_k</span>
            <input type="number" id="sp-top_k" step="1" min="0" />
          </label>
          <label class="sp-field">
            <span>min_p</span>
            <input type="number" id="sp-min_p" step="0.01" min="0" max="1" />
          </label>
          <label class="sp-field">
            <span>presence_penalty</span>
            <input type="number" id="sp-presence_penalty" step="0.1" />
          </label>
          <label class="sp-field">
            <span>repetition_penalty</span>
            <input type="number" id="sp-repetition_penalty" step="0.05" min="0" max="2" />
          </label>
          <label class="sp-field">
            <span>frequency_penalty</span>
            <input type="number" id="sp-frequency_penalty" step="0.1" />
          </label>
          <label class="sp-field">
            <span>max_tokens</span>
            <input type="number" id="sp-max_tokens" step="64" min="1" max="32768" />
          </label>
          <label class="sp-field">
            <span>seed</span>
            <input type="number" id="sp-seed" step="1" placeholder="(random)" />
          </label>
        </div>
        <div class="sp-actions">
          <button type="button" class="sp-reset" id="sp-reset">Reset to Qwen defaults</button>
          <span class="sp-hint">Saved in localStorage. Empty fields fall through to server defaults.</span>
        </div>
      </details>
      <form class="composer" id="composer" autocomplete="off">
        <textarea id="input"
          rows="1"
          placeholder="Message Flambeau…"
          aria-label="Message"></textarea>
        <button class="send-btn" id="send" type="submit" title="Send" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5" />
            <path d="M5 12l7-7 7 7" />
          </svg>
        </button>
      </form>
      <div class="pills" id="pills">
        <button class="pill" data-prompt="Help me write">✍︎ Write</button>
        <button class="pill" data-prompt="Explain this to me">✦ Learn</button>
        <button class="pill" data-prompt="Help me code">⟨⟩ Code</button>
        <button class="pill" data-prompt="Brainstorm ideas">✱ Brainstorm</button>
      </div>
      <div class="footnote">
        Streaming over <code style="color:var(--n8)">/v1/chat/completions</code>
        <span class="dot">·</span> Flambeau runs locally on your GPU
      </div>
    </div>

</div>

<script>
  // ---- state ---------------------------------------------------------------
  const thread   = document.getElementById("thread");
  const hero     = document.getElementById("hero");
  const main     = document.getElementById("main");
  const form     = document.getElementById("composer");
  const input    = document.getElementById("input");
  const send     = document.getElementById("send");
  const pills    = document.getElementById("pills");
  const modelTag = document.getElementById("model-tag");

  // System prompt — prepended to every request so the model has a stable
  // persona and doesn't greedy-stop after one token on short inputs.
  const SYSTEM_PROMPT = [
    "You are Flambeau, a concise and helpful AI assistant running locally on the user's GPU.",
    "Answer the user directly and completely. Do not repeat or loop. Do not produce empty responses.",
    "Use Markdown when helpful. For code, use fenced code blocks with the language tag.",
    "If the user's request is short or ambiguous, give a short but substantive answer rather than stopping.",
  ].join(" ");

  /** @type {{role:"system"|"user"|"assistant",content:string}[]} */
  const history = [{ role: "system", content: SYSTEM_PROMPT }];
  let generating = false;

  // C3.1 — minimum-viable Markdown renderer for assistant content.
  // Streaming-safe: callers re-invoke on the full accumulated buffer
  // each delta; result HTML is then assigned to .md-buffer.innerHTML.
  // Subset covers what Qwen actually emits in chat:
  //   - fenced code blocks ```lang\n...\n``` (unterminated → dashed)
  //   - inline code `…`
  //   - **bold** and *italic* (also __ / _)
  //   - [text](url) links
  //   - # / ## / ### headings (start of line)
  //   - - / * unordered lists, 1. ordered lists (consecutive lines)
  //   - > blockquote (consecutive lines)
  //   - --- horizontal rule
  // Skipped: tables, images, footnotes, autolinks. C3.2 layers
  // syntax-highlighting on top of the produced <code> blocks.
  function escapeHtml(s) {
    return s
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  function renderMarkdown(src) {
    if (!src) return "";

    // Step 1 — extract fenced code blocks. Two passes:
    // (a) closed fences: ```lang\n...body...\n``` — must end with the
    //     literal "\n```" (or "```" at the very start). Greedy matching
    //     stops at the first closing fence.
    // (b) one trailing unterminated fence at end-of-input: streaming
    //     mid-block. Renders with a dashed border so the user knows
    //     the model is still typing inside it.
    const blocks = [];
    let buf = "";
    {
      // Pass (a) — closed fences anywhere.
      const closedFence = /(^|\n)```([^\n`]*)\n([\s\S]*?)\n```(?=\n|$)/g;
      let last = 0;
      let m;
      while ((m = closedFence.exec(src)) !== null) {
        const matchStart = m.index + m[1].length; // skip the leading \n we captured
        buf += src.slice(last, matchStart);
        buf += `\x00CODE${blocks.length}\x00`;
        blocks.push({
          lang: (m[2] || "").trim(),
          body: m[3] ?? "",
          closed: true,
        });
        last = m.index + m[0].length;
      }
      let remainder = src.slice(last);
      // Pass (b) — single trailing unterminated fence. Must start at
      // beginning of remainder OR after a newline.
      const open = /(^|\n)```([^\n`]*)\n([\s\S]*)$/.exec(remainder);
      if (open) {
        buf += remainder.slice(0, open.index + open[1].length);
        buf += `\x00CODE${blocks.length}\x00`;
        blocks.push({
          lang: (open[2] || "").trim(),
          body: open[3] ?? "",
          closed: false,
        });
      } else {
        buf += remainder;
      }
    }

    // Step 2 — escape HTML on the non-code remainder.
    buf = escapeHtml(buf);

    // Step 3 — line-level transforms with light grouping.
    const lines = buf.split("\n");
    const out = [];
    let i = 0;
    const flushParagraph = (pBuf) => {
      if (pBuf.length === 0) return;
      // Collapse soft-wraps inside a paragraph using <br> for clarity;
      // the <p>'s `white-space:pre-wrap` already preserves them.
      out.push(`<p>${inlineTransforms(pBuf.join("\n"))}</p>`);
    };
    while (i < lines.length) {
      const ln = lines[i];
      const lnTrim = ln.trim();

      // Horizontal rule.
      if (/^---+$/.test(lnTrim) || /^\*\*\*+$/.test(lnTrim)) {
        out.push("<hr>");
        i++; continue;
      }
      // Headings.
      const h = /^(#{1,3})\s+(.*)$/.exec(ln);
      if (h) {
        const level = h[1].length;
        out.push(`<h${level}>${inlineTransforms(h[2])}</h${level}>`);
        i++; continue;
      }
      // Blockquote run.
      if (/^&gt;\s?/.test(ln)) {
        const body = [];
        while (i < lines.length && /^&gt;\s?/.test(lines[i])) {
          body.push(lines[i].replace(/^&gt;\s?/, ""));
          i++;
        }
        out.push(`<blockquote>${inlineTransforms(body.join("\n"))}</blockquote>`);
        continue;
      }
      // Unordered list run.
      if (/^[-*]\s+/.test(ln)) {
        const items = [];
        while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
          items.push(`<li>${inlineTransforms(lines[i].replace(/^[-*]\s+/, ""))}</li>`);
          i++;
        }
        out.push(`<ul>${items.join("")}</ul>`);
        continue;
      }
      // Ordered list run.
      if (/^\d+\.\s+/.test(ln)) {
        const items = [];
        while (i < lines.length && /^\d+\.\s+/.test(lines[i])) {
          items.push(`<li>${inlineTransforms(lines[i].replace(/^\d+\.\s+/, ""))}</li>`);
          i++;
        }
        out.push(`<ol>${items.join("")}</ol>`);
        continue;
      }
      // Paragraph: gather lines until blank.
      if (lnTrim.length === 0) { i++; continue; }
      const para = [ln];
      i++;
      while (i < lines.length) {
        const next = lines[i];
        if (next.trim().length === 0) break;
        if (/^(#{1,3})\s+/.test(next)) break;
        if (/^[-*]\s+/.test(next)) break;
        if (/^\d+\.\s+/.test(next)) break;
        if (/^&gt;\s?/.test(next)) break;
        if (/^---+$/.test(next.trim())) break;
        para.push(next);
        i++;
      }
      flushParagraph(para);
    }

    let html = out.join("\n");

    // Step 4 — inline transforms inside blocks already applied above
    //          via inlineTransforms(); nothing to do at the document
    //          level here.

    // Step 5 — splice fenced code blocks back in. Bodies pass through
    //          C3.2's syntax highlighter for the languages it knows;
    //          unknown languages fall through to plain HTML-escape.
    html = html.replace(/(?:<p>)?\x00CODE(\d+)\x00(?:<\/p>)?/g, (_m, n) => {
      const b = blocks[Number(n)];
      const cls = b.lang ? ` class="lang-${escapeHtml(b.lang)}"` : "";
      const preCls = b.closed ? "" : " class=\"unterminated\"";
      const inner = highlightCode(b.body, b.lang);
      return `<pre${preCls}><code${cls}>${inner}</code></pre>`;
    });

    return html;
  }

  // C3.2 — syntax highlighter. Per-language alternation regex with
  // named groups; we walk left-to-right, emit a span for each match
  // and HTML-escape the gaps. Comments and strings are listed first
  // in each pattern so keywords inside string/comment bodies don't
  // double-match.
  const HL_LANGUAGES = {
    rust: /(?<comment>\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(?<string>"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(?<keyword>\b(?:fn|let|mut|pub|use|impl|struct|enum|trait|match|if|else|return|for|while|loop|in|as|where|self|Self|true|false|crate|mod|move|ref|const|static|type|async|await|break|continue|dyn|extern|unsafe|box)\b)|(?<number>\b0[xX][0-9a-fA-F_]+\b|\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b)|(?<type>\b[A-Z][\w]*\b)/g,
    python: /(?<comment>#[^\n]*)|(?<string>"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(?<keyword>\b(?:def|class|import|from|as|if|elif|else|return|for|while|in|not|and|or|is|lambda|with|try|except|finally|raise|yield|pass|break|continue|global|nonlocal|None|True|False|async|await)\b)|(?<builtin>\b(?:print|len|range|str|int|float|list|dict|tuple|set|map|filter|sum|min|max|enumerate|zip|sorted|reversed|abs|all|any)\b)|(?<number>\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b)/g,
    json: /(?<string>"(?:[^"\\]|\\.)*")|(?<keyword>\b(?:true|false|null)\b)|(?<number>-?\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b)/g,
    bash: /(?<comment>#[^\n]*)|(?<string>"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(?<keyword>\b(?:if|then|fi|else|elif|for|do|done|while|until|case|esac|in|function|return|exit|export|local|declare|readonly|source|cd|echo|printf|read|set|unset|trap|shift|test)\b)|(?<number>\b\d+\b)/g,
    sh: /(?<comment>#[^\n]*)|(?<string>"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(?<keyword>\b(?:if|then|fi|else|elif|for|do|done|while|until|case|esac|in|function|return|exit|export|local|declare|readonly|source|cd|echo|printf|read|set|unset|trap|shift|test)\b)|(?<number>\b\d+\b)/g,
    c: /(?<preproc>^\s*#[^\n]*)|(?<comment>\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(?<string>"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(?<keyword>\b(?:int|void|char|short|long|float|double|signed|unsigned|struct|union|enum|typedef|static|extern|const|volatile|register|auto|sizeof|return|if|else|for|while|do|switch|case|default|break|continue|goto|NULL)\b)|(?<number>\b0[xX][0-9a-fA-F]+\b|\b\d+(?:\.\d+)?\b)/gm,
    cpp: /(?<preproc>^\s*#[^\n]*)|(?<comment>\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(?<string>"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(?<keyword>\b(?:int|void|char|short|long|float|double|bool|auto|class|struct|union|enum|namespace|using|template|typename|public|private|protected|virtual|override|final|static|extern|const|constexpr|volatile|mutable|sizeof|new|delete|return|if|else|for|while|do|switch|case|default|break|continue|throw|try|catch|nullptr|true|false|this)\b)|(?<number>\b0[xX][0-9a-fA-F]+\b|\b\d+(?:\.\d+)?\b)|(?<type>\b[A-Z][\w]*\b)/gm,
  };
  /** lang aliases → canonical key */
  const HL_ALIASES = {
    rs: "rust",
    py: "python",
    js: "javascript",
    ts: "javascript", // close enough for our needs
    javascript: "rust", // share keyword set; close-enough fallback
    shell: "sh",
    "c++": "cpp",
    cxx: "cpp",
    h: "c",
    hpp: "cpp",
    yaml: "json", // close enough — keywords are similar-ish
    yml: "json",
  };

  function highlightCode(body, lang) {
    const norm = (lang || "").toLowerCase();
    const key = HL_LANGUAGES[norm] ? norm
      : HL_LANGUAGES[HL_ALIASES[norm]] ? HL_ALIASES[norm]
      : null;
    if (!key) return escapeHtml(body);
    const pat = HL_LANGUAGES[key];
    pat.lastIndex = 0;
    let out = "";
    let cursor = 0;
    let m;
    while ((m = pat.exec(body)) !== null) {
      // Emit the un-tokenised gap (HTML-escaped) before this match.
      if (m.index > cursor) out += escapeHtml(body.slice(cursor, m.index));
      // Identify which capture group fired.
      const groups = m.groups || {};
      let cls = null;
      for (const k of Object.keys(groups)) {
        if (groups[k] !== undefined) { cls = k; break; }
      }
      const text = m[0];
      out += cls
        ? `<span class="hl-${cls}">${escapeHtml(text)}</span>`
        : escapeHtml(text);
      cursor = m.index + text.length;
      // Defensive against zero-width matches stalling the loop.
      if (text.length === 0) pat.lastIndex++;
    }
    if (cursor < body.length) out += escapeHtml(body.slice(cursor));
    return out;
  }
  /** Inline-level: code spans, bold, italic, links. Operates on
   *  HTML-escaped text — caller has already done escapeHtml(). */
  function inlineTransforms(s) {
    // 1. Inline code first (so its content is NOT touched by the
    //    bold/italic/link transforms).
    const codeStash = [];
    s = s.replace(/`([^`\n]+)`/g, (_m, body) => {
      codeStash.push(body);
      return `\x01CODE${codeStash.length - 1}\x01`;
    });
    // 2. Bold.
    s = s.replace(/\*\*([^\s*][^*]*?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/__([^\s_][^_]*?)__/g, "<strong>$1</strong>");
    // 3. Italic. Both forms require the boundary chars to be NOT-word
    //    characters so identifiers like `snake_case_var` and arithmetic
    //    like `a*b` don't get false-matched.
    s = s.replace(/(^|[^\w*])\*([^\s*][^*\n]*?)\*(?=[^\w*]|$)/g, "$1<em>$2</em>");
    s = s.replace(/(^|[^\w_])_([^\s_][^_\n]*?)_(?=[^\w_]|$)/g, "$1<em>$2</em>");
    // 4. Links. Plain [text](url); HTML-escape the URL.
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_m, text, url) =>
      `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${text}</a>`);
    // 5. Restore inline code. The stashed body was extracted AFTER the
    //    document-wide escapeHtml() at step-2 of renderMarkdown, so
    //    its content is already entity-encoded — wrap in <code>
    //    without re-escaping (otherwise &lt; → &amp;lt;).
    s = s.replace(/\x01CODE(\d+)\x01/g,
      (_m, n) => `<code>${codeStash[Number(n)]}</code>`);
    return s;
  }

  // C2.1 — sampler controls. Per-field localStorage; empty inputs fall
  // through to server defaults (so an empty `temperature` lets the
  // server use Qwen3.5's published default of 1.0 from `from_parts`).
  // The defaults below are the panel's idle values; *not* the wire
  // defaults — the server has its own, and we don't want to override
  // them per-request unless the user typed something.
  const SAMPLER_FIELDS = [
    "temperature", "top_p", "top_k", "min_p",
    "presence_penalty", "repetition_penalty", "frequency_penalty",
    "max_tokens", "seed",
  ];
  const SAMPLER_QWEN_DEFAULTS = {
    temperature: 0.8,
    top_p: 0.95,
    top_k: 20,
    min_p: 0,
    presence_penalty: 1.5,
    repetition_penalty: 1.1,
    frequency_penalty: 0,
    max_tokens: 1024,
    seed: "",
  };
  const SAMPLER_LS_KEY = "flambeau.sampler.v1";

  function loadSamplerState() {
    try {
      const raw = localStorage.getItem(SAMPLER_LS_KEY);
      if (!raw) return { ...SAMPLER_QWEN_DEFAULTS };
      const parsed = JSON.parse(raw);
      const merged = { ...SAMPLER_QWEN_DEFAULTS, ...parsed };
      return merged;
    } catch { return { ...SAMPLER_QWEN_DEFAULTS }; }
  }
  function saveSamplerState(state) {
    try { localStorage.setItem(SAMPLER_LS_KEY, JSON.stringify(state)); }
    catch {}
  }

  const samplerState = loadSamplerState();

  function paintSamplerPanel() {
    for (const field of SAMPLER_FIELDS) {
      const el = document.getElementById(`sp-${field}`);
      if (!el) continue;
      const v = samplerState[field];
      el.value = (v === null || v === undefined) ? "" : String(v);
    }
    paintSamplerSummary();
  }
  function paintSamplerSummary() {
    const sum = document.getElementById("sp-summary");
    if (!sum) return;
    // Show the fields that diverge from the *server*'s defaults — and
    // since we don't know the server's defaults precisely from the JS
    // side, just show non-empty fields.
    const parts = [];
    for (const f of SAMPLER_FIELDS) {
      const v = samplerState[f];
      if (v === "" || v === null || v === undefined) continue;
      parts.push(`${f}=${v}`);
    }
    sum.textContent = parts.length ? parts.join(", ") : "all defaults";
  }
  /** Returns the partial body fields to splice into the request.
   *  Empty / unparseable inputs are omitted entirely so the server
   *  applies its own per-field default. */
  function currentSamplerArgs() {
    const out = {};
    for (const f of SAMPLER_FIELDS) {
      const v = samplerState[f];
      if (v === "" || v === null || v === undefined) continue;
      const n = Number(v);
      if (!Number.isFinite(n)) continue;
      // Integer-only fields are coerced to int; the rest pass through.
      if (f === "top_k" || f === "max_tokens") out[f] = Math.trunc(n);
      else if (f === "seed") out[f] = Math.trunc(n);
      else out[f] = n;
    }
    return out;
  }

  // Wire panel inputs.
  for (const field of SAMPLER_FIELDS) {
    const el = document.getElementById(`sp-${field}`);
    if (!el) continue;
    el.addEventListener("input", () => {
      samplerState[field] = el.value;
      saveSamplerState(samplerState);
      paintSamplerSummary();
    });
  }
  document.getElementById("sp-reset")?.addEventListener("click", () => {
    Object.assign(samplerState, SAMPLER_QWEN_DEFAULTS);
    saveSamplerState(samplerState);
    paintSamplerPanel();
  });
  paintSamplerPanel();

  // ---- model discovery -----------------------------------------------------
  fetch("/v1/models").then(r => r.json()).then(j => {
    const id = j?.data?.[0]?.id || "flambeau";
    modelTag.textContent = id;
  }).catch(() => { modelTag.textContent = "flambeau"; });

  // C4.2 — remote-tools panel. Calls C4.1's `/v1/tools` and groups the
  // returned tools by `server_url` for display. Whole panel stays
  // hidden if the server has no `--mcp` upstreams configured.
  async function refreshToolsPanel() {
    const panel = document.getElementById("tools-panel");
    const summary = document.getElementById("tp-summary");
    const body = document.getElementById("tp-body");
    if (!panel || !summary || !body) return;
    let data;
    try {
      const res = await fetch("/v1/tools");
      if (!res.ok) throw new Error("HTTP " + res.status);
      data = await res.json();
    } catch (e) {
      panel.hidden = true;
      return;
    }
    const tools = Array.isArray(data?.remote_tools) ? data.remote_tools : [];
    if (tools.length === 0) {
      panel.hidden = true;
      return;
    }
    panel.hidden = false;
    // Group tools by server_url so users see one block per upstream.
    const byServer = new Map();
    for (const t of tools) {
      const k = t.server_url || "(unknown)";
      if (!byServer.has(k)) byServer.set(k, []);
      byServer.get(k).push(t);
    }
    summary.textContent = `${tools.length} tool${tools.length !== 1 ? "s" : ""} on ${byServer.size} server${byServer.size !== 1 ? "s" : ""}`;
    // Render. innerHTML wipe is fine — the body never has stateful DOM.
    body.innerHTML = "";
    for (const [url, ts] of byServer) {
      const block = document.createElement("div");
      block.className = "tp-server";
      const head = document.createElement("div");
      head.className = "tp-server-head";
      head.textContent = url;
      block.appendChild(head);
      for (const t of ts) {
        const tool = document.createElement("div");
        tool.className = "tp-tool";
        const name = document.createElement("div");
        name.className = "tp-tool-name";
        name.textContent = t.name;
        tool.appendChild(name);
        if (t.description) {
          const desc = document.createElement("div");
          desc.className = "tp-tool-desc";
          desc.textContent = t.description;
          tool.appendChild(desc);
        }
        if (t.input_schema && Object.keys(t.input_schema).length > 0) {
          const sch = document.createElement("pre");
          sch.className = "tp-tool-schema";
          try {
            sch.textContent = JSON.stringify(t.input_schema, null, 2);
          } catch {
            sch.textContent = String(t.input_schema);
          }
          tool.appendChild(sch);
        }
        block.appendChild(tool);
      }
      body.appendChild(block);
    }
  }
  document.getElementById("tp-refresh")?.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    refreshToolsPanel();
  });
  refreshToolsPanel();

  // ---- textarea auto-grow --------------------------------------------------
  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 240) + "px";
  }
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  // ---- pills ---------------------------------------------------------------
  pills.addEventListener("click", e => {
    const btn = e.target.closest(".pill");
    if (!btn) return;
    input.value = btn.dataset.prompt + " ";
    input.focus();
    autosize();
  });

  // ---- rendering -----------------------------------------------------------
  function appendUserMessage(text) {
    thread.classList.add("has-messages");
    const wrap = document.createElement("div");
    wrap.className = "msg user";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(bubble);
    thread.appendChild(wrap);
    scrollToBottom();
  }

  function appendAssistantShell() {
    const wrap = document.createElement("div");
    wrap.className = "msg assistant";
    const tag = document.createElement("div");
    tag.className = "role-tag";
    tag.textContent = "Flambeau";
    const content = document.createElement("div");
    content.className = "content";
    const dots = document.createElement("span");
    dots.className = "dots";
    dots.innerHTML = "<span></span><span></span><span></span>";
    content.appendChild(dots);
    wrap.appendChild(tag);
    wrap.appendChild(content);
    thread.appendChild(wrap);
    scrollToBottom();
    return { wrap, content, dots };
  }

  function appendError(msg) {
    const el = document.createElement("div");
    el.className = "error";
    el.textContent = msg;
    thread.appendChild(el);
    scrollToBottom();
  }

  function scrollToBottom() {
    // next frame so layout settles
    requestAnimationFrame(() => {
      main.scrollTop = main.scrollHeight;
    });
  }

  // ---- SSE line parser -----------------------------------------------------
  // Parses the OpenAI-style `data: {...}\n\n` framing out of a raw stream
  // buffer and yields deltas. Handles split chunks.
  function makeSseParser(onFrame) {
    let buffer = "";
    return function feed(chunk) {
      buffer += chunk;
      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const frame = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        // A frame may contain several `data:` lines; collect them all.
        const lines = frame.split("\n");
        for (const line of lines) {
          if (!line.startsWith("data:")) continue;
          const payload = line.slice(5).trim();
          if (!payload) continue;
          onFrame(payload);
        }
      }
    };
  }

  // ---- streaming submit ----------------------------------------------------
  async function submitPrompt(text) {
    if (generating || !text.trim()) return;
    generating = true;
    send.disabled = true;

    history.push({ role: "user", content: text });
    appendUserMessage(text);

    const { wrap, content, dots } = appendAssistantShell();
    let firstDelta = true;
    let assistantText = "";
    let finishReason = null;
    const caret = document.createElement("span");
    caret.className = "caret";
    // C1.1 — per-tool-call accumulation state, keyed by streaming `index`.
    /** @type {Map<number, {id:string,name:string,args:string,card:HTMLDetailsElement,argsPre:HTMLPreElement,nameSpan:HTMLSpanElement,idSpan:HTMLSpanElement}>} */
    const toolCalls = new Map();
    // C3.1 — text accumulates into an .md-buffer that's re-rendered as
    // Markdown on each delta. A fresh buffer is started after each
    // tool-call open so subsequent text appears AFTER the card in
    // DOM order (matches the wire-stream interleaving).
    let mdBuffer = null;
    let mdBufferText = "";

    const ensureFirstDeltaPainted = () => {
      if (firstDelta) {
        content.innerHTML = "";
        content.appendChild(caret);
        firstDelta = false;
      }
    };
    function freshMdBuffer() {
      mdBuffer = document.createElement("span");
      mdBuffer.className = "md-buffer";
      mdBufferText = "";
      ensureFirstDeltaPainted();
      content.insertBefore(mdBuffer, caret);
    }

    /** Build a fresh tool-call card and insert it BEFORE the caret so
     *  subsequent text deltas continue to flow at the end. */
    function createToolCallCard(index) {
      const card = document.createElement("details");
      card.className = "tool-call-card";
      card.open = false;
      const summary = document.createElement("summary");
      const icon = document.createElement("span");
      icon.className = "tc-icon";
      icon.textContent = "🔧";
      const nameSpan = document.createElement("span");
      nameSpan.className = "tc-name";
      nameSpan.textContent = `tool_call[${index}]`;
      const idSpan = document.createElement("span");
      idSpan.className = "tc-id";
      summary.append(icon, nameSpan, idSpan);
      const argsPre = document.createElement("pre");
      argsPre.className = "tc-args streaming";
      card.append(summary, argsPre);
      // Slot it into the content area, before the caret if present.
      ensureFirstDeltaPainted();
      content.insertBefore(card, caret);
      scrollToBottom();
      return { card, summary, nameSpan, idSpan, argsPre };
    }

    let reader;
    try {
      const res = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "text/event-stream" },
        body: JSON.stringify({
          model: modelTag.textContent,
          messages: history,
          stream: true,
          // C2.1 — sampler args read from the panel; non-empty fields
          // override the server's per-field defaults.
          ...currentSamplerArgs(),
        }),
      });

      if (!res.ok) {
        const body = await res.text().catch(() => "");
        throw new Error(`HTTP ${res.status} ${res.statusText}${body ? " — " + body : ""}`);
      }
      if (!res.body) throw new Error("no response body");

      reader = res.body.getReader();
      const decoder = new TextDecoder("utf-8");

      const parser = makeSseParser(payload => {
        if (payload === "[DONE]") return;
        let obj;
        try { obj = JSON.parse(payload); } catch { return; }
        if (obj?.error) throw new Error(obj.error.message || "server error");
        const choice = obj?.choices?.[0];
        const delta = choice?.delta;

        // Plain content stream (T2.5 / T3.1 text path). Re-render the
        // current md-buffer's text on every delta so Markdown updates
        // live (C3.1). A fresh buffer is created lazily here and after
        // each tool-call open so cards interleave with text in DOM
        // order matching the stream.
        const contentDelta = delta?.content;
        if (typeof contentDelta === "string" && contentDelta.length) {
          ensureFirstDeltaPainted();
          assistantText += contentDelta;
          if (!mdBuffer) freshMdBuffer();
          mdBufferText += contentDelta;
          mdBuffer.innerHTML = renderMarkdown(mdBufferText);
          scrollToBottom();
        }

        // C1.1 — tool-call deltas. OpenAI shape: each chunk carries
        // `delta.tool_calls = [{index, id?, type?, function:{name?, arguments?}}, ...]`.
        // Open/close events arrive as the chunks with `id`+`name`;
        // arguments stream incrementally. Multiple indices may
        // coexist when `parallel_tool_calls=true`.
        const tcDeltas = delta?.tool_calls;
        if (Array.isArray(tcDeltas)) {
          for (const tc of tcDeltas) {
            if (typeof tc?.index !== "number") continue;
            const idx = tc.index;
            let entry = toolCalls.get(idx);
            if (!entry) {
              const dom = createToolCallCard(idx);
              entry = {
                id: "",
                name: "",
                args: "",
                card: dom.card,
                argsPre: dom.argsPre,
                nameSpan: dom.nameSpan,
                idSpan: dom.idSpan,
              };
              toolCalls.set(idx, entry);
              // C3.1 — seal the current md-buffer so any subsequent
              // text appears AFTER this card in DOM order, matching
              // the wire stream's interleaving.
              mdBuffer = null;
            }
            if (typeof tc.id === "string" && tc.id) {
              entry.id = tc.id;
              entry.idSpan.textContent = tc.id;
            }
            const fname = tc.function?.name;
            if (typeof fname === "string" && fname) {
              entry.name = fname;
              entry.nameSpan.textContent = fname;
            }
            const fargs = tc.function?.arguments;
            if (typeof fargs === "string" && fargs.length) {
              entry.args += fargs;
              entry.argsPre.textContent = entry.args;
              scrollToBottom();
            }
          }
        }

        if (choice?.finish_reason) {
          finishReason = choice.finish_reason;
        }
      });

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        parser(decoder.decode(value, { stream: true }));
      }
      parser(decoder.decode()); // flush
    } catch (err) {
      appendError(err.message || String(err));
    } finally {
      // Always tear down the thinking indicator and caret, even when the
      // stream closed with zero content tokens (greedy-stop on short prompts)
      // — otherwise the dots spin forever and it looks like the server hung.
      try { caret.remove(); } catch {}
      try { dots.remove(); } catch {}
      // C1.1 — stop the per-card streaming-blink on every tool call.
      for (const entry of toolCalls.values()) {
        entry.argsPre.classList.remove("streaming");
      }
      // Auto-expand the first card if the assistant turn was tool-call-only
      // (no text content) — otherwise the user just sees a single closed
      // header and might miss what's happening.
      if (toolCalls.size > 0 && !assistantText) {
        const first = toolCalls.values().next().value;
        if (first) first.card.open = true;
      }
      const noContent = firstDelta && !assistantText && toolCalls.size === 0;
      if (noContent) {
        const hint = document.createElement("span");
        hint.className = "empty-hint";
        const reason = finishReason ? finishReason : "no data";
        hint.innerHTML =
          `(empty response — <span class="finish">finish_reason: ${reason}</span>. ` +
          `Flambeau's greedy decoder often stops after one token on short prompts; ` +
          `try a more concrete question, or set max_tokens higher.)`;
        content.appendChild(hint);
      }
      // C1.1 — push tool_calls into history alongside content so a
      // subsequent turn (C1.2's role=tool reply) sees the full
      // assistant message, not just the text part.
      const histEntry = {
        role: "assistant",
        content: assistantText,
      };
      let serialisedToolCalls = null;
      if (toolCalls.size > 0) {
        // Re-key by `index` order; OpenAI expects the array shape.
        const indices = [...toolCalls.keys()].sort((a, b) => a - b);
        serialisedToolCalls = indices.map(i => {
          const e = toolCalls.get(i);
          return {
            id: e.id || `call_${i}`,
            type: "function",
            function: { name: e.name, arguments: e.args },
          };
        });
        histEntry.tool_calls = serialisedToolCalls;
        if (!assistantText) histEntry.content = null;
      }
      history.push(histEntry);

      // C1.2 — finish_reason badge + (when tool_calls) the inline
      // tool-reply form. Only attach when something happened — empty
      // turns already have the empty-hint above.
      if (finishReason && !noContent) {
        const badge = document.createElement("span");
        badge.className = `finish-badge ${finishReason.replace("_", "-")}`;
        badge.textContent = `finish_reason: ${finishReason}`;
        wrap.appendChild(badge);
      }
      if (finishReason === "tool_calls" && serialisedToolCalls && serialisedToolCalls.length > 0) {
        appendToolReplyForm(wrap, serialisedToolCalls);
      }

      generating = false;
      send.disabled = false;
      input.focus();
    }
  }

  /** C1.2 — render the tool-reply form below an assistant turn that
   *  ended in finish_reason="tool_calls". One textarea per call.
   *  Submit pushes one role=tool message per call (in the same order
   *  the model emitted them) and re-runs the chat completion so the
   *  model can produce its next turn. */
  function appendToolReplyForm(wrap, calls) {
    const formEl = document.createElement("div");
    formEl.className = "tool-reply-form";
    const title = document.createElement("div");
    title.className = "trf-title";
    title.textContent = `provide ${calls.length} tool result${calls.length > 1 ? "s" : ""}`;
    formEl.appendChild(title);

    /** @type {HTMLTextAreaElement[]} */
    const textareas = calls.map((call) => {
      const row = document.createElement("div");
      row.className = "trf-row";
      const label = document.createElement("label");
      label.className = "trf-label";
      const nameSpan = document.createElement("span");
      nameSpan.className = "trf-call-name";
      nameSpan.textContent = call.function?.name || "(unnamed)";
      label.appendChild(nameSpan);
      label.appendChild(document.createTextNode(`  ·  ${call.id}`));
      const ta = document.createElement("textarea");
      ta.placeholder = `Result for ${call.id} — JSON or plain text`;
      row.append(label, ta);
      formEl.appendChild(row);
      return ta;
    });

    const actions = document.createElement("div");
    actions.className = "trf-actions";
    const submitBtn = document.createElement("button");
    submitBtn.type = "button";
    submitBtn.textContent = `Send tool result${calls.length > 1 ? "s" : ""}`;
    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "ghost";
    cancelBtn.textContent = "Skip";
    const hint = document.createElement("span");
    hint.className = "trf-hint";
    hint.textContent = "results re-run the conversation through the model";
    actions.append(submitBtn, cancelBtn, hint);
    formEl.appendChild(actions);

    submitBtn.addEventListener("click", async () => {
      if (generating) return;
      // Push one role=tool message per call (in OpenAI order, by index).
      for (let i = 0; i < calls.length; i++) {
        history.push({
          role: "tool",
          tool_call_id: calls[i].id,
          content: textareas[i].value || "",
        });
      }
      // Render the user's tool replies in the transcript so the
      // conversation reads naturally on scroll-back.
      for (let i = 0; i < calls.length; i++) {
        const tag = document.createElement("div");
        tag.className = "msg user";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent =
          `[tool ${calls[i].function?.name || "?"} → ${calls[i].id}]\n${textareas[i].value || ""}`;
        tag.appendChild(bubble);
        thread.appendChild(tag);
      }
      formEl.remove();
      scrollToBottom();
      // Re-run the chat completion. submitPromptResume() goes through
      // the same SSE pipeline as submitPrompt() but skips the user
      // message append (the role=tool turns ARE the prompt).
      submitPromptResume();
    });
    cancelBtn.addEventListener("click", () => formEl.remove());

    wrap.appendChild(formEl);
    scrollToBottom();
    textareas[0]?.focus();
  }

  /** Re-run the chat completion against the current `history` without
   *  appending a new user message — used to follow up after the user
   *  has provided role=tool replies (C1.2). Mirrors submitPrompt's
   *  fetch + SSE pipeline. */
  async function submitPromptResume() {
    if (generating) return;
    generating = true;
    send.disabled = true;
    const { wrap, content, dots } = appendAssistantShell();
    let firstDelta = true;
    let assistantText = "";
    let finishReason = null;
    const caret = document.createElement("span");
    caret.className = "caret";
    /** @type {Map<number, any>} */
    const toolCalls = new Map();
    let mdBuffer = null;
    let mdBufferText = "";
    const ensureFirstDeltaPainted = () => {
      if (firstDelta) {
        content.innerHTML = "";
        content.appendChild(caret);
        firstDelta = false;
      }
    };
    function freshMdBuffer() {
      mdBuffer = document.createElement("span");
      mdBuffer.className = "md-buffer";
      mdBufferText = "";
      ensureFirstDeltaPainted();
      content.insertBefore(mdBuffer, caret);
    }
    function createToolCallCard(index) {
      const card = document.createElement("details");
      card.className = "tool-call-card";
      const summary = document.createElement("summary");
      const icon = document.createElement("span");
      icon.className = "tc-icon"; icon.textContent = "🔧";
      const nameSpan = document.createElement("span");
      nameSpan.className = "tc-name";
      nameSpan.textContent = `tool_call[${index}]`;
      const idSpan = document.createElement("span");
      idSpan.className = "tc-id";
      summary.append(icon, nameSpan, idSpan);
      const argsPre = document.createElement("pre");
      argsPre.className = "tc-args streaming";
      card.append(summary, argsPre);
      ensureFirstDeltaPainted();
      content.insertBefore(card, caret);
      scrollToBottom();
      return { card, nameSpan, idSpan, argsPre };
    }

    let reader;
    try {
      const res = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "text/event-stream" },
        body: JSON.stringify({
          model: modelTag.textContent,
          messages: history,
          stream: true,
          ...currentSamplerArgs(),
        }),
      });
      if (!res.ok) {
        const body = await res.text().catch(() => "");
        throw new Error(`HTTP ${res.status} ${res.statusText}${body ? " — " + body : ""}`);
      }
      if (!res.body) throw new Error("no response body");
      reader = res.body.getReader();
      const decoder = new TextDecoder("utf-8");
      const parser = makeSseParser(payload => {
        if (payload === "[DONE]") return;
        let obj;
        try { obj = JSON.parse(payload); } catch { return; }
        if (obj?.error) throw new Error(obj.error.message || "server error");
        const choice = obj?.choices?.[0];
        const delta = choice?.delta;
        const cd = delta?.content;
        if (typeof cd === "string" && cd.length) {
          ensureFirstDeltaPainted();
          assistantText += cd;
          if (!mdBuffer) freshMdBuffer();
          mdBufferText += cd;
          mdBuffer.innerHTML = renderMarkdown(mdBufferText);
          scrollToBottom();
        }
        const tcDeltas = delta?.tool_calls;
        if (Array.isArray(tcDeltas)) {
          for (const tc of tcDeltas) {
            if (typeof tc?.index !== "number") continue;
            const idx = tc.index;
            let entry = toolCalls.get(idx);
            if (!entry) {
              const dom = createToolCallCard(idx);
              entry = { id: "", name: "", args: "", ...dom };
              toolCalls.set(idx, entry);
              mdBuffer = null;
            }
            if (typeof tc.id === "string" && tc.id) {
              entry.id = tc.id; entry.idSpan.textContent = tc.id;
            }
            const fname = tc.function?.name;
            if (typeof fname === "string" && fname) {
              entry.name = fname; entry.nameSpan.textContent = fname;
            }
            const fargs = tc.function?.arguments;
            if (typeof fargs === "string" && fargs.length) {
              entry.args += fargs;
              entry.argsPre.textContent = entry.args;
              scrollToBottom();
            }
          }
        }
        if (choice?.finish_reason) finishReason = choice.finish_reason;
      });
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        parser(decoder.decode(value, { stream: true }));
      }
      parser(decoder.decode());
    } catch (err) {
      appendError(err.message || String(err));
    } finally {
      try { caret.remove(); } catch {}
      try { dots.remove(); } catch {}
      for (const e of toolCalls.values()) e.argsPre.classList.remove("streaming");
      if (toolCalls.size > 0 && !assistantText) {
        const first = toolCalls.values().next().value;
        if (first) first.card.open = true;
      }
      const noContent = firstDelta && !assistantText && toolCalls.size === 0;
      if (noContent) {
        const hint = document.createElement("span");
        hint.className = "empty-hint";
        const reason = finishReason ? finishReason : "no data";
        hint.innerHTML =
          `(empty response — <span class="finish">finish_reason: ${reason}</span>)`;
        content.appendChild(hint);
      }
      const histEntry = { role: "assistant", content: assistantText };
      let serialisedToolCalls = null;
      if (toolCalls.size > 0) {
        const indices = [...toolCalls.keys()].sort((a, b) => a - b);
        serialisedToolCalls = indices.map(i => {
          const e = toolCalls.get(i);
          return { id: e.id || `call_${i}`, type: "function",
                   function: { name: e.name, arguments: e.args } };
        });
        histEntry.tool_calls = serialisedToolCalls;
        if (!assistantText) histEntry.content = null;
      }
      history.push(histEntry);
      if (finishReason && !noContent) {
        const badge = document.createElement("span");
        badge.className = `finish-badge ${finishReason.replace("_", "-")}`;
        badge.textContent = `finish_reason: ${finishReason}`;
        wrap.appendChild(badge);
      }
      if (finishReason === "tool_calls" && serialisedToolCalls && serialisedToolCalls.length > 0) {
        appendToolReplyForm(wrap, serialisedToolCalls);
      }
      generating = false;
      send.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value;
    input.value = "";
    autosize();
    submitPrompt(text);
  });

  // focus on load
  input.focus();
</script>
</body>
</html>
