[package]
name = "flambeau-forward"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Topology executor for model forward passes. A model writes ONE forward function generic over `ForwardCtx`; per-topology impls (Pp, Tp, Hybrid) provide composite ops that compose leaf primitives from flambeau-model-ops with the right AR / peer-copy / handoff placement. Replaces the per-arch × per-topology forward-path duplication in crates/blocks::topology + crates/models/*."

[features]
default = []
hip = [
    "dep:flambeau-backend-hip",
    "dep:flambeau-blocks",
    "flambeau-model-ops/hip",
    "flambeau-ops/hip",
    "flambeau-blocks/hip",
]

[dependencies]
flambeau-core = { path = "../core" }
flambeau-quant = { path = "../quant" }
flambeau-model-ops = { path = "../model-ops" }
flambeau-ops = { path = "../ops" }
flambeau-runtime = { path = "../runtime" }
flambeau-backend-hip = { path = "../backend-hip", optional = true }
# blocks::DeltaNetLayer is reused as the GDN math primitive (~500 LOC
# of orchestration we don't want to duplicate). v2 owns the composite
# surface; blocks owns the math sequence.
flambeau-blocks = { path = "../blocks", optional = true }
anyhow.workspace = true
bytemuck.workspace = true
half.workspace = true
tracing.workspace = true

[dev-dependencies]
bytemuck.workspace = true

[lints]
workspace = true
