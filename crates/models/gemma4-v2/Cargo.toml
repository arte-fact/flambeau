[package]
name = "flambeau-gemma4-v2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gemma-4 dense (31B) on the v2 stack. GELU-tanh FFN, final-logit softcap, tied LM head, per-layer SWA alternation, sqrt(n_embd) input scale."

[features]
default = []
hip = ["dep:flambeau-backend-hip", "flambeau-forward/hip", "flambeau-model-ops/hip", "flambeau-ops/hip", "flambeau-blocks/hip"]

[dependencies]
flambeau-core = { path = "../../core" }
flambeau-quant = { path = "../../quant" }
flambeau-model-ops = { path = "../../model-ops" }
flambeau-ops = { path = "../../ops" }
flambeau-blocks = { path = "../../blocks" }
flambeau-forward = { path = "../../forward" }
flambeau-backend-hip = { path = "../../backend-hip", optional = true }
anyhow.workspace = true
thiserror.workspace = true
half.workspace = true
bytemuck.workspace = true
tracing.workspace = true

[lints]
workspace = true
