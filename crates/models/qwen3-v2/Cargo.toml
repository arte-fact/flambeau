[package]
name = "flambeau-qwen3-v2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Qwen3 dense-attention thin model crate (v2 stack). Composes forward_one_token from flambeau-forward composites; the model glue is just config parsing + GGUF weight upload + the per-arch forward sequence."

[features]
default = []
hip = ["dep:flambeau-backend-hip", "flambeau-forward/hip", "flambeau-model-ops/hip", "flambeau-ops/hip"]

[dependencies]
flambeau-core = { path = "../../core" }
flambeau-quant = { path = "../../quant" }
flambeau-model-ops = { path = "../../model-ops" }
flambeau-ops = { path = "../../ops" }
flambeau-forward = { path = "../../forward" }
flambeau-backend-hip = { path = "../../backend-hip", optional = true }
anyhow.workspace = true
thiserror.workspace = true
half.workspace = true
bytemuck.workspace = true
tracing.workspace = true

[lints]
workspace = true
