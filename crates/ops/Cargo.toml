[package]
name = "flambeau-ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "High-level fused ops (Attention, MoE, DenseMlp, SwiGLU, RmsNorm, RoPE, GDN) composed from core traits. Mesh-generic."

[features]
default = []
# The op-launch layer is backend-generic; each feature only pulls the matching
# backend's launch-plane impl + kernel catalogue. Both can be enabled at once.
hip = ["dep:flambeau-backend-hip", "dep:flambeau-kernels-hip"]
cuda = ["dep:flambeau-backend-cuda", "dep:flambeau-kernels-cuda"]

[dependencies]
flambeau-core = { path = "../core" }
flambeau-quant = { path = "../quant" }
# flambeau-runtime is intentionally NOT a dependency: runtime → ops → backend-hip
# → runtime would cycle. Mesh-generic trait surface lands in V1.7.5 behind a
# trait that lives in core or runtime (not here).
flambeau-backend-hip = { path = "../backend-hip", optional = true }
flambeau-kernels-hip = { path = "../kernels-hip", optional = true }
flambeau-backend-cuda = { path = "../backend-cuda", optional = true }
flambeau-kernels-cuda = { path = "../kernels-cuda", optional = true }
anyhow.workspace = true
thiserror.workspace = true

[dev-dependencies]
half.workspace = true

[lints]
workspace = true
