notes   = "4-warp LDS-tiled. MMQ_Y=32, MMQ_X=8, 256 threads/block. Manual int8x4 dot; dp4a/v_dot4_i32_i8 refactor is the next V1.4 perf step, followed by stream-K fixup + L2 prefetch."

[[qmatmul_mmq]]
dtype   = "Q4_K"
dtype_q = "Q8_1"
shape   = { m = ">=128", k = "any", n = "any" }
impl    = "qmatmul_q4_K_mmq_4warp_lds_gfx906"
cert    = "certs/hip/gfx906/qmatmul_q4_K_mmq_4warp_lds_gfx906.json"
notes   = "V1.4 — 4-warp LDS-tiled Q4_K MMQ. MMQ_Y=16, MMQ_X=8, 128 threads. F32 dequant-into-LDS; int8-tile + dp4a refactor is the next perf step."

[[qmatmul_mmq]]
dtype   = "Q6_K"
dtype_q = "Q8_1"
shape   = { m = ">=128", k = "any", n = "any" }
impl    = "qmatmul_q6_K_mmq_4warp_lds_gfx906"
cert    = "certs/hip/gfx906/qmatmul_q6_K_mmq_4warp_lds_gfx906.json"
