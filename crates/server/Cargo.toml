[package]
name = "flambeau-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenAI-compatible HTTP server (/v1/chat/completions, /v1/completions, /v1/models, SSE)."

[dependencies]
flambeau-core = { path = "../core" }
flambeau-runtime = { path = "../runtime" }
flambeau-quant = { path = "../quant" }
flambeau-qwen3-moe = { path = "../models/qwen3-moe" }
flambeau-gemma4 = { path = "../models/gemma4", optional = true }
flambeau-blocks = { path = "../blocks", optional = true }
flambeau-ops = { path = "../ops" }
anyhow.workspace = true
axum.workspace = true
tower.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
half.workspace = true

[dependencies.flambeau-backend-hip]
path = "../backend-hip"
optional = true

[features]
default = []
# HIP inference backend. Off by default so `cargo check` works without ROCm.
hip = [
    "dep:flambeau-backend-hip",
    "dep:flambeau-blocks",
    "dep:flambeau-gemma4",
    "flambeau-blocks/hip",
    "flambeau-ops/hip",
    "flambeau-qwen3-moe/hip",
    "flambeau-gemma4/hip",
]
# Enables debug FLAMBEAU_* env-var reads (TRACE_BATCH, DUMP_PROMPT,
# DUMP_RAW_REQ, DEBUG_TOOL_RAW, PROFILE_DECODE, HOST_PROFILE) in release
# builds. Off by default; production binaries elide them.
dev_trace = ["flambeau-qwen3-moe/dev_trace", "flambeau-quant/dev_trace"]

[dev-dependencies]
axum.workspace = true
tokio-util = "0.7"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
