# Environment-variable impact audit spec.
#
# Each [var.NAME] block defines a measurement plan for one env var:
#   - which models / topologies actually exercise the code path
#   - which values to compare (default vs alternates)
#   - which metrics to capture (perf, VRAM, correctness)
#
# The harness (`cargo run -p bench -- env-impact`) emits one cert
# per var under `certs/env_impact/<NAME>.md` with the measured deltas.
# Triage decision (delete / migrate-to-dispatch / keep-as-flag /
# promote-to-default) is recorded in the cert and rolls into MEMORY.md.
#
# Class taxonomy (inherited from the env-purge plan):
#   A = dead / experiment-finished       -> verify-then-delete
#   B = kernel variant / fusion gate     -> migrate to dispatch table
#   C = server runtime config            -> migrate to ServeConfig + clap
#   D = debug / tracing                  -> migrate to tracing crate
#
# Vars already covered by an existing cert or memory entry are NOT
# re-listed here. See `certs/perf/`, `certs/hip/gfx906/`, and
# MEMORY.md (entries citing FLAMBEAU_*) for prior measurements.

[meta]
output_dir          = "certs/env_impact"
runs_per_cell       = 3        # post-warmup samples; cert reports median + spread
warmup_runs         = 2
noise_floor_pct     = 2.0      # |delta| below this is reported as "null"
prompt_len          = 512      # pp512 — same as bench matrix convention
tg_len              = 64       # tg64
seed                = 0
correctness_check   = "first_8_tokens_bit_identical"  # falsifies non-perf-only changes
ctx_cap             = 4096     # bench prompt is ~3313 tokens + 64 max_tokens; ctx<3500 OOMs the KV cache
                                # 9B / 36 layers / 4 KV heads / 128 head_dim @ ctx=4096 = ~295 MB/slot;
                                # 8 slots ≈ 2.4 GB total split across 4× MI50 (pp2tp2) — fine.
sample_vram         = true     # rocm-smi sample after server ready; record peak per GPU + total

# Logical model labels -> GGUF paths. The harness resolves at run time.
[meta.models]
"qwen35-9b-q4_1"            = "/artefact/models/Qwen3.5-9B-Q4_1.gguf"
"qwen36-27b-q4_0"           = "/artefact/models/Qwen3.6-27B-Q4_0.gguf"
"qwen36-27b-q4_1"           = "/artefact/models/Qwen3.6-27B-Q4_1.gguf"
"qwen36-27b-q8_0"           = "/artefact/models/Qwen3.6-27B-Q8_0.gguf"
"qwen36-35b-a3b-q4_0"       = "/artefact/models/Qwen_Qwen3.6-35B-A3B-Q4_0.gguf"
"qwen36-35b-a3b-q4ks"       = "/artefact/models/Qwen3.6-35B-A3B-UD-Q4_K_S.gguf"

[meta.topologies]
# mesh_mode strings are passed directly to `--mesh-mode` (CLI expects
# "pp" | "tp" | "pp+tp"). Device ordering matches scripts/bench/run_matrix.py
# defaults: cross-die {0,2} for pp2/tp2 to spread thermal load.
"pp4"     = { devices = "0,1,2,3", mesh_mode = "pp" }
"tp2"     = { devices = "0,2",     mesh_mode = "tp",    tp_size = 2 }
"pp2tp2"  = { devices = "0,2,1,3", mesh_mode = "pp+tp", pp_size = 2, tp_size = 2 }


# ─────────────────────────────────────────────────────────────────────
# Class X — pure baseline characterization (no var under test).
# Iterates concurrencies under the optimized profile to map the
# throughput / TTFT-p99 / VRAM curve. Single test_value `"unset"` =
# no env override, just measure default behavior at each N.
# ─────────────────────────────────────────────────────────────────────

[var.FLAMBEAU_BASELINE_9B_PP2TP2]
class           = "X"
description     = "Baseline characterization of Qwen3.5-9B on pp2tp2 across N=[1,2,4,8]"
default_state   = "n/a"
test_values     = ["unset"]
models          = ["qwen35-9b-q4_1"]
topologies      = ["pp2tp2"]
concurrencies   = [1, 2, 4, 8]
metrics         = ["agg_tps", "ttft_p99_ms", "vram_peak_gb"]
preconditions   = { FLAMBEAU_INFLIGHT_SLOTS = "8" }   # 8 slots so N≤8 always fits
notes           = """
Measures aggregate throughput + TTFT p99 + peak VRAM at each
concurrency level on Qwen3.5-9B / pp2tp2 against the optimized
profile baseline. The environment variable name is a placeholder
(no actual var read in code); the harness still exercises every
booth/measurement path the way real env-var tests do, including
sample_vram=true.

Result curve answers:
  - Where does aggregate throughput saturate (does N=8 plateau or grow)?
  - How does TTFT p99 evolve with N (head-of-line blocking?)
  - VRAM scaling: linear in N? plateaus once KV cache + scratch are
    sized at INFLIGHT_SLOTS=8?
"""


[var.FLAMBEAU_BASELINE_27B_PP2TP2]
class           = "X"
description     = "Smoke bench 27B/pp2tp2 N=1/4 (S2-style verification)"
default_state   = "n/a"
test_values     = ["unset"]
models          = ["qwen36-27b-q4_0"]
topologies      = ["pp2tp2"]
concurrencies   = [1, 4]
metrics         = ["agg_tps", "ttft_p99_ms", "vram_peak_gb"]
preconditions   = { FLAMBEAU_INFLIGHT_SLOTS = "8" }
notes           = "Smoke verification gate between cleanup slices."

[var.FLAMBEAU_BASELINE_35B_PP2TP2]
class           = "X"
description     = "Smoke bench 35B-A3B/pp2tp2 N=1/4"
default_state   = "n/a"
test_values     = ["unset"]
models          = ["qwen36-35b-a3b-q4_0"]
topologies      = ["pp2tp2"]
concurrencies   = [1, 4]
metrics         = ["agg_tps", "ttft_p99_ms", "vram_peak_gb"]
preconditions   = { FLAMBEAU_INFLIGHT_SLOTS = "8" }
