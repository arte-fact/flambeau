dtype_q = "Q8_1"
shape   = { m = ">=128", k = "any", n = "any" }
impl    = "qmatmul_q4_K_mmq_wave64_gfx906"
cert    = "certs/hip/gfx906/qmatmul_q4_K_mmq_wave64_gfx906.json"
notes   = "V2.3.b.2 — wave64 MMQ port of candle's `mul_mat_q4_K_gfx906_impl_fast`. Replaces V1.4's F32-tile placeholder. Consumes standard flambeau_block_q8_1 (NOT DS4 MMQ), so no upstream quantise change. 1 warp / 64 rows × 8 cols per tile, DP4A inner — same launch shape as Q5_K wave64."

[[qmatmul_mmq]]
dtype   = "Q6_K"
dtype_q = "Q8_1"
shape   = { m = ">=128", k = "any", n = "any" }
impl    = "qmatmul_q6_K_mmq_wave64_gfx906"
cert    = "certs/hip/gfx906/qmatmul_q6_K_mmq_wave64_gfx906.json"
notes   = "V2.3.b.4 — wave64 MMQ Q6_K. Flambeau-authored (candle has no Q6_K MMQ); mirrors the wave64 / MMQ_Y=64 / TILE_N=8 / DP4A structure used by Q4_K and Q5_K wave64. Per-sub-block decode packs 32 weights into 8 signed-int8 int32s (-32 pre-applied). Consumes standard flambeau_block_q8_1."

